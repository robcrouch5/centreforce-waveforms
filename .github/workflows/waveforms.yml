name: Generate waveforms

# Runs hourly, generates peaks for any NEW listen-back show and uploads the
# JSON to the web host. Idempotent — shows that already have a waveform are
# skipped, so a typical run finishes in ~1 minute and uses almost no quota.

on:
  # Primary trigger: cron_listenback.php fires a repository_dispatch the instant a
  # new show is imported into listen_back, so waveforms appear within ~1-2 min
  # instead of waiting on GitHub's (heavily throttled, unreliable) scheduler.
  repository_dispatch:
    types: [new-listenback]
  # Backstop only — catches anything the dispatch missed (e.g. cron ran while the
  # token/network was down). Kept as a safety net since it's no longer the main path.
  schedule:
    - cron: '5,20,35,50 * * * *'   # 4×/hour safety net (matches the live centreforce-waveforms repo)
  workflow_dispatch: {}       # adds a manual "Run workflow" button for testing

concurrency:
  group: waveforms
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # audiowaveform used to install from the chris-needham Launchpad PPA, but that
      # PPA 503s intermittently (sometimes for hours) and killed the whole run. We now
      # build it from source (GitHub + the reliable Ubuntu main archive, no PPA) and
      # cache the binary, so it only builds once and never depends on Launchpad again.
      - name: Install lftp, sshpass + audiowaveform runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp sshpass \
            libmad0 libid3tag0 libsndfile1 libgd3 \
            libboost-filesystem1.74.0 libboost-program-options1.74.0 libboost-regex1.74.0

      - name: Cache audiowaveform binary
        id: aw-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/audiowaveform
          key: audiowaveform-1.11.1-jammy-v1

      - name: Build audiowaveform from source (only if not cached)
        if: steps.aw-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y git make cmake gcc g++ \
            libmad0-dev libid3tag0-dev libsndfile1-dev libgd-dev \
            libboost-filesystem-dev libboost-program-options-dev libboost-regex-dev zlib1g-dev
          git clone --depth 1 --branch 1.11.1 https://github.com/bbc/audiowaveform.git /tmp/audiowaveform
          cd /tmp/audiowaveform
          mkdir build && cd build
          cmake -D ENABLE_TESTS=0 ..
          make -j"$(nproc)"
          mkdir -p "$HOME/.local/bin"
          cp audiowaveform "$HOME/.local/bin/audiowaveform"

      - name: Put audiowaveform on PATH + verify
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/audiowaveform" --version

      - name: Generate & upload new waveforms
        env:
          SITE_BASE:      ${{ vars.SITE_BASE }}
          FTP_PROTOCOL:   ${{ vars.FTP_PROTOCOL }}
          FTP_PORT:       ${{ vars.FTP_PORT }}
          FTP_SSL:        ${{ vars.FTP_SSL }}
          FTP_HOST:       ${{ secrets.FTP_HOST }}
          FTP_USER:       ${{ secrets.FTP_USER }}
          FTP_PASS:       ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: bash scripts/generate_waveforms_ci.sh
